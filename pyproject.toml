[project]
name = "meal-planner-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shrutivilankar", email = "shruti.vilankar@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.160.0",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "lancedb>=0.40.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.16",
    "openai>=3.31.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
meal-planner-agent = "meal_planner_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
